{% extends 'app/base.html' %}

{% block title %}Create Board - Focal Point{% endblock %}
{% block page_title %}<a href="{% url 'board-list' %}" class="crumb">Boards</a><span class="crumb-sep">/</span>New board{% endblock %}

{% block content %}
    <div class="panel panel--narrow">
        <h2 class="panel__title">Create board</h2>

        {% if error %}
            <div class="message error">{{ error }}</div>
        {% endif %}

        <form method="post" class="form" novalidate>
            {% csrf_token %}
            <div class="form-field">
                <label for="name">Board name</label>
                <input type="text" id="name" name="name" maxlength="200" required autofocus placeholder="e.g. Sprint 1">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn--primary">Create board</button>
                <a href="{% url 'board-list' %}" class="btn">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}
